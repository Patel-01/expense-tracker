services:
  # One service: the root Dockerfile builds the frontend and Express serves it alongside the API.
  - type: web
    name: todo-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
